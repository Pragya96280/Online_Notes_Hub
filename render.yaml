services:
  - type: web
    name: notes-hub-mern
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
